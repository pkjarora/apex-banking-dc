apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: banking-data-pvc
  namespace: banking
  annotations:
    # Nutanix NDK replication annotation — adjust group name to match your NDK policy
    ndk.nutanix.com/replication-group: "banking-replication-group"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nutanix-volume  # Nutanix CSI StorageClass
  resources:
    requests:
      storage: 5Gi
