apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-ingress
  namespace: banking
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - host: banking.dc.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: banking-svc
                port:
                  number: 8080
